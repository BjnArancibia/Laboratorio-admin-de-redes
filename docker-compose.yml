services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-19007}:8080"
    networks:
      - public-net
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy

  catalog:
    build: ./catalog
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - CURRENCY=${CURRENCY:-MXN}
    networks:
      - public-net
      - internal-net
    depends_on:
      db:
        condition: service_healthy

  orders:
    build: ./orders
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    networks:
      - public-net
      - internal-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  worker:
    build: ./worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    networks:
      - internal-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # incidente 3: un docker kill cuenta como parada manual y la politica restart no
  # vuelve a levantar a redis, asi que este servicio lo revisa y lo arranca si quedo detenido
  cache-guard:
    image: docker:27-cli
    restart: always
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - DOCKER_CONFIG=/tmp/docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # depende de cache para que en un down se detenga antes que redis
    depends_on:
      cache:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        proyecto=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)")
        echo "vigilando cache del proyecto $$proyecto"
        while true; do
          for c in $$(docker ps -aq --filter "label=com.docker.compose.project=$$proyecto" --filter "label=com.docker.compose.service=cache" --filter "status=exited"); do
            echo "$$(date -Iseconds) cache detenido, reiniciando $$c"
            docker start "$$c" >/dev/null
          done
          sleep 2 & wait $$!
        done

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
    driver: local

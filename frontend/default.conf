# Configuración de Nginx para el frontend. NO modificar.
# Escucha en el puerto 8080 (permite correr como usuario no root).
# Copiar este archivo a /etc/nginx/conf.d/default.conf dentro de la imagen.
server {
    listen 8080;
    server_name _;

    # DNS interno de Docker: los nombres de servicio se resuelven en tiempo de ejecución.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/orders {
        set $orders http://orders:3000;
        proxy_pass $orders;
    }

    location /api/ {
        set $catalog http://catalog:8000;
        proxy_pass $catalog;
    }
}
